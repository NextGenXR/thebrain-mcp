[project]
name = "thebrain-mcp"
version = "1.0.0"
description = "MCP server for TheBrain API - enables AI assistants to interact with TheBrain knowledge management system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["mcp", "thebrain", "knowledge-management", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "typing-extensions>=4.9.0",
    "jsonschema>=4.20.0",
    # Graph analysis capabilities
    "networkx>=3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
visualization = [
    "python-louvain>=0.16",  # Community detection
    "pyvis>=0.3.0",          # Interactive visualization
    "plotly>=5.0.0",         # Advanced plotting
]

[project.scripts]
thebrain-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.black]
line-length = 100
target-version = ['py310']
