[project]
name = "thebrain-mcp"
dynamic = ["version"]
description = "Python client library for TheBrain API with local caching and incremental sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "TheBrain MCP Contributors" }
]
keywords = ["thebrain", "knowledge-management", "api", "cache", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.25.0",
    "tenacity>=8.0.0",
    "networkx>=3.0",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
visualization = [
    "pyvis>=0.3.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/thebrain_mcp"]

[tool.hatch.build.targets.sdist]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
