# Optional: run thebrain-mcp in a container (for future streamable-http MCP server).
# Today the image only verifies the library loads; mount a volume for cache when server is added.
services:
  thebrain-mcp:
    build: .
    env_file: .env
    environment:
      - THEBRAIN_API_KEY=${THEBRAIN_API_KEY}
    # When MCP server is added: ports, volume for SQLite cache
    # ports: ["8000:8000"]
    # volumes: ["./data:/app/data"]
    # command: ["python", "-m", "thebrain_mcp.server", "--transport", "streamable-http", "--port", "8000"]
    restart: "no"
